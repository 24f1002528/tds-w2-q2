name: CI with Cache

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache something simple
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: cache-folder
          key: cache-9a69e51

      - name: prime-cache-9a69e51
        run: echo "Cache hit? -> ${{ steps.cache-deps.outputs.cache-hit }}"

      - name: Create folder if missing
        run: mkdir -p cache-folder
