name: Cache Demo

on: [push]  # Triggers on any push

jobs:
  demo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: prime-cache-9a69e51 # Your required step name
      id: cache-step
      uses: actions/cache@v4  # Required version (or newer)
      with:
        key: cache-9a69e51  # Exact fixed key required
        path: node_modules  # Cache this folder (change for your deps)
        
    - name: Show cache result
      run: echo "Cache result: ${{ steps.cache-step.outputs.cache-hit }}"
      
    - name: Install deps (for demo)
      if: steps.cache-step.outputs.cache-hit != 'true'
      run: npm install  # Or pip install -r requirements.txt
